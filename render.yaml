services:
  - type: web
    name: coaching-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: COACH_ROLE_ID
        sync: false
      - key: TICKET_CATEGORY_ID
        sync: false
      - key: REVIEWS_CHANNEL_ID
        sync: false
      - key: WELCOME_CHANNEL_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: TZ
        value: Europe/Paris
